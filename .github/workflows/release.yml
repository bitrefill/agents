name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Test packaging failures and archive contents
        run: python -m unittest discover -s tests -v
      - name: Build and validate release archive
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/package_plugin.py --tag "$RELEASE_TAG"
          else
            python scripts/package_plugin.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bitrefill-plugin
          path: |
            dist/bitrefill.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bitrefill-plugin
          path: dist
      - name: Publish validated plugin archive
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bitrefill.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Portable Agent Plugins 1.0 package with OpenAI and Codex metadata,
            bundled skills, MCP configuration, and logo. SHA256SUMS covers the ZIP.

            Package validation does not establish OpenAI public-directory approval.
            Digital-goods commerce requires OpenAI policy review. Live MCP/OAuth
            tests, demo recording, reviewer access, scans and attestations must be
            completed before directory submission.
            [OpenAI review preparation](https://github.com/bitrefill/agents/blob/${{ github.ref_name }}/docs/openai-review.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
